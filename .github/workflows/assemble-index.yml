name: Assemble staged Leonida index
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/assemble-index.yml'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Assemble and verify exact source
        shell: bash
        run: |
          set -euo pipefail
          cat .upload/index-*.part > index.html
          test "$(wc -c < index.html | tr -d '[:space:]')" = "7058007"
          echo "2ff09bca757b52a96e1ae5faf77776443922bc5f7b832829d58d3c65d9995166  index.html" | sha256sum --check -
      - name: Keep only the intended site file
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .upload
          rm -f .github/workflows/assemble-index.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add the Leonida portfolio as index.html"
          git push origin HEAD:main
